{% extends 'base.html' %}
{% block content %}
  <div class="card">
    <h1>Reset your password</h1>
    <p>Enter your email or phone number to receive a temporary password.</p>
    <form method="post">
      <label>Email or phone</label>
      <input type="text" name="identifier" required />
      <button type="submit">Reset password</button>
    </form>
  </div>
{% endblock %}
